version: "3.8"

services:
  mcp-skillset:
    build: .
    container_name: mcp-skillset
    restart: unless-stopped
    volumes:
      - mcp_chroma_data:/app/chroma_db
      # Uncomment the next line if you want to mount your local custom skills directly without rebuilding
      # - ./custom-skills:/app/skills/custom
    ports:
      - "3001:3001"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  mcp_chroma_data:
    driver: local
